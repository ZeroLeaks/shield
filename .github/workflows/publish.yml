name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the npm release without publishing
        required: true
        type: boolean
        default: true
      npm_tag:
        description: npm distribution tag
        required: true
        type: choice
        options:
          - latest
          - next
        default: latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Check whether the version is already published
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          if (response.ok) console.log(`${name}@${version} is already published; skipping publication.`);
          JS

      - name: Verify repository provenance identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { repository } = JSON.parse(readFileSync('package.json', 'utf8'));
          const declared = repository.url.replace(/^git\+/, '').replace(/\.git\/?$/, '').replace(/\/$/, '');
          const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
          assert.equal(declared, expected, 'package.json repository.url must match GitHub provenance, including capitalization');
          JS

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Update npm CLI
        run: npm install --global npm@latest

      - name: Configure initial-publish token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi

      - name: Validate package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public --loglevel verbose

      - name: Publish package
        if: steps.registry.outputs.published != 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        env:
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_TAG" --loglevel verbose
